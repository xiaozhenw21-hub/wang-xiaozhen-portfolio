name: Inspect video HLS sizes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-video-sizes.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Estimate HLS video sizes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse
          BASE='https://wang-xiaozhen-visual-portfolio.xiaozhenw21.chatgpt.site/assets/'
          slugs=['heritage','majiang','erlitou','qiaoqiao','nice','fan','six-hours']
          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r: return r.read().decode('utf-8','ignore')
          def head_size(url):
              req=urllib.request.Request(url,method='HEAD')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return int(r.headers.get('Content-Length') or 0)
              except Exception:
                  try:
                      with urllib.request.urlopen(url,timeout=30) as r:
                          return int(r.headers.get('Content-Length') or 0)
                  except Exception:
                      return 0
          def walk(url, seen):
              if url in seen: return [],[]
              seen.add(url)
              txt=get(url)
              playlists=[]; media=[]
              for line in txt.splitlines():
                  line=line.strip()
                  if not line or line.startswith('#'): continue
                  child=urllib.parse.urljoin(url,line)
                  if '.m3u8' in line: playlists.append(child)
                  else: media.append(child)
              for p in playlists:
                  p2,m2=walk(p,seen); playlists+=p2; media+=m2
              return playlists,media
          for s in slugs:
              root=BASE+s+'/index.m3u8'
              try:
                  pls,media=walk(root,set())
                  uniq=list(dict.fromkeys(media))
                  total=sum(head_size(u) for u in uniq)
                  print(f'{s}: segments={len(uniq)} approx={total/1024/1024:.1f} MB playlists={len(pls)+1}')
              except Exception as e:
                  print(f'{s}: ERROR {e}')
          PY
