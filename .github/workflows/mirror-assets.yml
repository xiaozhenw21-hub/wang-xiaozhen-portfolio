name: Mirror portfolio assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror external images into repository
        shell: bash
        run: |
          set -u
          mkdir -p assets
          PREFIX='https://wang-xiaozhen-visual-portfolio.xiaozhenw21.chatgpt.site/assets/'
          PLACEHOLDER=''
          mapfile -t URLS < <(grep -oE 'https://wang-xiaozhen-visual-portfolio\.xiaozhenw21\.chatgpt\.site/assets/[^" <)]+' index.html | sort -u)
          echo "Found ${#URLS[@]} external images"
          for url in "${URLS[@]}"; do
            name="${url##*/}"
            echo "Fetching $name"
            if ! curl -L --fail --silent --show-error --retry 2 --connect-timeout 15 --max-time 90 "$url" -o "assets/$name"; then
              echo "Using placeholder for $name"
              printf '%s' "$PLACEHOLDER" | base64 -d > "assets/$name"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://wang-xiaozhen-visual-portfolio.xiaozhenw21.chatgpt.site/assets/','assets/')
          # If any future image still fails, remove the broken-image icon and use a neutral background.
          fallback = """<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('img').forEach(i=>{i.addEventListener('error',()=>{i.removeAttribute('src');i.style.background='linear-gradient(135deg,#e8dfd2,#f7f2e9)';i.style.minHeight=i.style.minHeight||'120px';},{once:true})})});</script>"""
          if fallback not in s:
              s=s.replace('</body>', fallback+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Mirror portfolio images for GitHub Pages'
          git push
